<!-- conversation_messages.html -->

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    {% if conversation %}
        <!-- Conversation exists, display messages -->
        <h1>Conversation</h1>
        <div id="message-container">
            <!-- Display messages here -->
            {% for message in conversation.messages.all %}
                <!-- Display each message -->
                <p>{{ message.content }}</p>
            {% endfor %}
        </div>
    {% else %}
        <!-- Conversation does not exist, display a message -->
        <h1>Conversation Not Found</h1>
        <p>The conversation you are looking for does not exist.</p>
    {% endif %}


    <script>
        $(document).ready(function(){
            setInterval(function(){
                $.ajax({
                    type: 'GET',
                    url: "{% url 'conversation_messages' profile_user_id=profile_user_id %}",  // Updated URL
                    success: function(response){
                        $("#message-container").html(response);
                        console.log('New messages fetched.');
                    },
                    error: function(response){
                        console.error('Error fetching new messages:', response);
                    }
                });
            }, 1000);
        });
        </script>
