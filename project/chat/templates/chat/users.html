{% block extra_css %}
    <!-- Include extra CSS files specific to this child template -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
{% endblock extra_css %}
<style>
    .messages_side_bar {
        background-color: #FFFFFF;
        width: 280px;
        height: 500px;
        float: right;
        margin-top: 40px;
        margin-right: 20px;
        border-radius: 28px 28px 0 0;
        padding: 25px 16px 0px 18px;
        cursor: pointer;
        position: relative;
    }

    .search-container {
        display: flex;
        align-items: center;
        border: 1px solid #ccc;
        border-radius: 10px;
        padding: 4px;
        background: #F7F5F2;
        width: 250px;
        margin-top: 18px;
        margin-bottom: 5px;
    }

    .glyphicon-search {
        color: #C8C6C6;
        padding: 4px;
    }

    .search-input {
        background-color: #F7F5F2;
        flex-grow: 1;
        border: none;
        outline: none;
        padding: 4px;
        border: 0;
    }

    .requests {
        float: right;
        color: #008DDA;
    }

    .user {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
    }

    .user img {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        margin-right: 10px;
    }

    .view_all_chat {
        position: absolute;
        bottom: 0;
        right: 0;
        margin-bottom: 10px;
        margin-right: 16px;
        color: #4c4b4b;
    }
</style>

<h1>User Profiles</h1>

<div class="messages_side_bar">
    Messages
    <div class="search-container">
        <i class="glyphicon glyphicon-search"></i>
        <input type="text" class="search-input" placeholder="Search">
    </div>

    <a href="" class="requests">Requests</a>
    <hr style="margin-top: 30px;">

    <div class="users">
        {% for utilisateur in utilisateurs %}
        <div class="user">
            <a href="{% url 'conversation_messages' utilisateur.user_id %}" class="user-profile-link">
                {% if utilisateur.photo_profil %}
                <img src="{{ utilisateur.photo_profil.url }}" class="user-avatar" alt="Avatar">
                {% else %}
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ4MJsV58xh-vFYz3u4WMpS65vCvnGwBYc54SfmKToORTHdZALkZNGvpBlt4dc45A0M-y0&usqp=CAU"
                    class="user-avatar" alt="Placeholder Avatar">
                {% endif %}
                <span>{{ utilisateur.nom }} {{ utilisateur.prenom }}</span>
            </a>
        </div>
        {% endfor %}
    </div>
    <a href="" class="view_all_chat">View All</a>
</div>
