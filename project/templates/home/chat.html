{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container {
            display: flex;
        }

        body {
            background-color: #E8E2E2;
        }

        .nav_chat,.side_chat,.messages {
            flex: 1;
            height: 100vh;
        }

        .nav_chat {
            background-color: #E8E2E2;
            max-width: 240px;
        }

        .side_chat {
            border-left: 0.2px solid #a3a2a2;
            background-color: #E8E2E2;
            max-width: 350px;
        }

        .chat_list_header {
            height: 65px;
            background-color: #343a40;
        }


        .messages {
            border-left: 0.2px solid #a3a2a2;
            /* Add left border */
            background-color: #E8E2E2;
        }
    </style>
</head>

<body>
    <div class="container">
        <nav class="nav_chat">Nav Chat</nav>
        <div class="side_chat">
            Side Chat

            <div class="chat_list_header">
                Chats
            </div>

        </div>
        <div class="messages">Messages</div>
    </div>


</body>

</html>
