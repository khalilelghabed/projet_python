{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="file1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-vZ1+TL2AB6+1MWNoJzQKnvLr+TgD7GlGlkF9hOL+sPf4a7Nz9p1Anz+VCNXLGGfKARc+44LpMJxy5okWfwYDdA==" crossorigin="anonymous" referrerpolicy="no-referrer" />  
    <link rel="stylesheet" href={% static "css/style.css" %}>
</head>
<body>
<header>
    <div class="logo"><img src="logo.jpg" alt="logo"></div>
    <div class="hed2">
        <button class="active" onclick="selectButton(this)">Home</button>
        <button  onclick="selectButton(this)">Jobs</button>
        <button  onclick="selectButton(this)">Events</button>
    </div>
    <script>
        function selectButton(btn) {
            // Remove active class from all buttons
            document.querySelectorAll('.hed2 button').forEach((button) => {
                button.classList.remove('active');
            });
    
            // Add active class to the clicked button
            btn.classList.add('active');
        }
    </script>
    
    <div class="search">
       <input type="text" class="searchTerm" placeholder="What are you looking for?">
       <button type="submit" class="searchButton">
            <i class="fa fa-search"></i>
        </button>
    </div>
    <div class="hed4">
        <div class="notification-container">
            <button class="notification-icon" onclick="toggleNotifications()">
                <i class="fas fa-bell"></i>
                <div class="notifications-count js-count">0</div>
            </button>
            <div class="notifications-dropdown" id="notificationsDropdown">
                <ul>
                    <li><div class="notification-item">
                        <img class="profile-picture" src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-chat/ava3.webp" alt="Profile Picture">
                        <div class="notification-content">
                            <div class="author-name">Author Name</div>
                            <div class="notification-details">
                                <span class="notification-type">Type</span>
                                <span class="notification-date">Date</span>
                            </div>
                            <div class="notification-text">Notification Content</div>
                        </div>
                        <button class="close-button" onclick="removeNotification(event)">X</button>
                    </div>
                    </li>
                    <li><div class="notification-item">
                        <img class="profile-picture" src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-chat/ava3.webp" alt="Profile Picture">
                        <div class="notification-content">
                            <div class="author-name">Author Name</div>
                            <div class="notification-details">
                                <span class="notification-type">Type</span>
                                <span class="notification-date">Date</span>
                            </div>
                            <div class="notification-text">Notification Content</div>
                        </div>
                        <button class="close-button" onclick="removeNotification(event)">X</button>
                    </div>
                    </li>
                    <li><div class="notification-item">
                        <img class="profile-picture" src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-chat/ava3.webp" alt="Profile Picture">
                        <div class="notification-content">
                            <div class="author-name">Author Name</div>
                            <div class="notification-details">
                                <span class="notification-type">Type</span>
                                <span class="notification-date">Date</span>
                            </div>
                            <div class="notification-text">Notification Content</div>
                        </div>
                        <button class="close-button" onclick="removeNotification(event)">X</button>
                    </div>
                    </li>
                </ul>
            </div>
        </div>
        
    </div>
    <script>
    // Call updateNotificationCount on page load
        updateNotificationCount();

        function toggleNotifications() {
            var dropdown = document.getElementById("notificationsDropdown");
            if (dropdown.style.display === "none") {
                dropdown.style.display = "block";
            } else {
                dropdown.style.display = "none";
            }
        }
        function updateNotificationCount() {
            var countElement = document.querySelector('.notifications-count');
            var dropdown = document.getElementById("notificationsDropdown");
            var notificationCount = dropdown.querySelectorAll('.notification-item').length;
        
            countElement.textContent = notificationCount;
            countElement.style.display = notificationCount > 0 ? 'inline' : 'none';
        }
        

      
        function removeNotification(event) {
            var notificationItem = event.target.closest('.notification-item');
            if (notificationItem) {
                notificationItem.remove();
                updateNotificationCount(-1);
            }
        }
        
        
        
    </script>
    <div class="profile">
        <button class="dropdown-btn" onclick="toggleDropdown()"><img src={% static "images/user_image.png" %} alt="Profile Image"></button>
        <div class="dropdown-content" id="dropdown-content">
            <a href="#">Profile</a>
            <a href="#">Settings</a>
            <a href="#">Log Out</a>
        </div>
    </div>
    
    <script>
        function toggleDropdown() {
            var dropdownContent = document.getElementById("dropdown-content");
            dropdownContent.style.display = dropdownContent.style.display === "block" ? "none" : "block";
        }
    
        // Close the dropdown menu if the user clicks outside of it
        window.onclick = function(event) {
            var dropdownContent = document.getElementById("dropdown-content");
            var profilePictureButton = document.querySelector(".profile img");
    
            if (event.target !== profilePictureButton && event.target !== dropdownContent) {
                dropdownContent.style.display = "none";
            }
        }
    </script>
    


</header>
<nav>nav</nav>
{% block content %}{% endblock content %}
<footer>footer</footer>


    
</body>
</html>
