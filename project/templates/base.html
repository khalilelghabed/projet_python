    <style>

<body>
    
<header>
    <div class="logo"><p class="logo-text"><span class="career">Career</span><span class="forge">Forge</span></p></div>
    <div class="hed2">
        <button class="active" onclick="selectButton(this)">Home</button>
        <button  onclick="selectButton(this)">Jobs</button>
        <button  onclick="selectButton(this)">Events</button>
    </div>
    <script>
        function selectButton(btn) {
            // Remove active class from all buttons
            document.querySelectorAll('.hed2 button').forEach((button) => {
                button.classList.remove('active');
            });
    
            // Add active class to the clicked button
            btn.classList.add('active');
        }
    </script>
    


    
    <div class="search">
        <form action="{% url 'search' %}" method="Post" style="width:80%">
            {% csrf_token %}
               
                <input name= 'search' type="text" class="searchTerm" placeholder="What are you looking for?" >
                <input type="hidden" name="type_search" value="ens">
                <button type="submit" class="searchButton1">
                    <i class="fa fa-search"></i>
                </button>
        </form>
    </div>
   











{% if user.is_authenticated %}
    <div class="hed4">
        <div class="notification-container" >
            <button class="notification-icon" onclick="toggleNotifications()">
                <i class="fas fa-bell"></i>
                <div class="notifications-count js-count" id="notification_nolues">{{nombre_notifications_non_lues}}</div>
            </button>
            <div class="notifications-dropdown" id="notificationsDropdown" style="display: none;">
                <ul>
                    
                    
                   
                </ul>
            </div>
        </div>
        
    </div>
    {% endif %}
    <script>
    // Call updateNotificationCount on page load
        updateNotificationCount();

        function toggleNotifications() {
            var dropdown = document.getElementById("notificationsDropdown");
            if (dropdown.style.display === "none") {
                dropdown.style.display = "block";
            } else {
                dropdown.style.display = "none";
            }
        }
        function updateNotificationCount() {
            var countElement = document.querySelector('.notifications-count');
            var dropdown = document.getElementById("notificationsDropdown");
            var Count = document.getElementById('notification_nolues');
            nouveauCount=Count.innerText
            notificationCount=parseInt(nouveauCount)
            
        
            countElement.textContent = notificationCount;
            countElement.style.display = notificationCount > 0 ? 'inline' : 'none';
        }
        

      
        function removeNotification(event) {
            var notificationItem = event.target.closest('.notification-item');
            if (notificationItem) {
                notificationItem.remove();
                updateNotificationCount(-1);
            }
        }
        
        
        
    </script>
    {% if user.is_authenticated %}
    <div class="profile">
        <button class="dropdown-btn" onclick="toggleDropdown()"><img src="{{ user.utilisateur.photo_profil.url }}" alt="Profile Image"></button>
        <div class="dropdown-content" id="dropdown-content">
            <a href="{% url 'profil_page' user.id %}">Profile</a>
            <a href="#">Settings</a>
            <a href="#">Log Out</a>
        </div>
    </div>
    {% endif %}
    
    <script>
        function toggleDropdown() {
            var dropdownContent = document.getElementById("dropdown-content");
            dropdownContent.style.display = dropdownContent.style.display === "block" ? "none" : "block";
        }
    
        // Close the dropdown menu if the user clicks outside of it
        window.onclick = function(event) {
            var dropdownContent = document.getElementById("dropdown-content");
            var profilePictureButton = document.querySelector(".profile img");
    
            if (event.target !== profilePictureButton && event.target !== dropdownContent) {
                dropdownContent.style.display = "none";
            }
        }
    </script>
    


</header>
